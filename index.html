<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PodFlow — Podcast Tracker</title>
<meta name="theme-color" content="#0070C0">
<style>
:root {
    --bg:#f5f5f7; --card:#fff; --text:#1d1d1f; --text-sec:#6e6e73;
    --border:#e5e5ea; --green:#34c759; --red:#ff3b30; --orange:#ff9500;
    --r:16px; --topbar:52px;
    --accent:#0070C0;
}
body.dark {
    --bg:#1c1c1e; --card:#2c2c2e; --text:#f5f5f7; --text-sec:#aeaeb2; --border:#3a3a3c;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s}

/* ── Topbar ── */
.topbar{
    position:sticky;top:0;z-index:100;height:var(--topbar);
    background:rgba(255,255,255,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-bottom:1px solid var(--border);display:flex;align-items:center;
    padding:0 20px;gap:12px;transition:background .3s;
}
body.dark .topbar{background:rgba(28,28,30,.85);}
.topbar-logo{font-size:15px;font-weight:800;letter-spacing:-.3px;}
.topbar-logo span{color:var(--accent);}

.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
.dark-btn{background:none;border:none;cursor:pointer;color:var(--text-sec);font-size:18px;padding:4px;}
.links{display:flex;gap:8px;}
.links a{font-size:12px;font-weight:600;color:var(--text-sec);text-decoration:none;padding:4px 8px;border-radius:8px;transition:background .15s;}
.links a:hover{background:var(--border);}

/* ── Layout ── */
.main{max-width:1100px;margin:0 auto;padding:20px 16px 60px;display:flex;flex-direction:column;gap:16px;}

/* ── Cartes ── */
.card{background:var(--card);border-radius:var(--r);padding:18px 20px;box-shadow:0 2px 12px rgba(0,0,0,.06);transition:background .3s;}

/* ── Barre de chargement ── */
.loading-card{text-align:center;padding:32px 20px;}
.loading-title{font-size:15px;font-weight:600;margin-bottom:12px;color:var(--text-sec);}
.progress-track{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:0 auto 8px;max-width:300px;}
.progress-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .3s;width:0%;}
.progress-label{font-size:12px;color:var(--text-sec);}

/* ── Résumé ── */
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;}
.summary-cell{background:var(--bg);border-radius:12px;padding:14px 16px;text-align:center;}
.summary-val{font-size:32px;font-weight:800;letter-spacing:-1.5px;line-height:1;}
.summary-lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--text-sec);margin-top:4px;}
.summary-sub{font-size:11px;color:var(--text-sec);margin-top:2px;}

/* ── Graphe 8 jours ── */
.chart-wrap{display:flex;align-items:flex-end;gap:4px;height:80px;margin-top:12px;}
.chart-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;}
.chart-bar{width:100%;border-radius:4px 4px 0 0;background:var(--text);opacity:.15;min-height:3px;position:relative;display:flex;align-items:center;justify-content:center;transition:opacity .2s;}
.chart-bar.has{opacity:1;}
.chart-bar.today{background:var(--accent);opacity:1;}
.chart-bar.yesterday{background:var(--accent);opacity:.6;}
.chart-count{font-size:8px;font-weight:700;color:#fff;position:absolute;}
.chart-lbl{font-size:9px;color:var(--text-sec);font-weight:500;}
.chart-lbl.today{color:var(--accent);font-weight:700;}
.chart-lbl.yesterday{color:var(--accent);opacity:.7;font-weight:600;}

/* ── Liste podcasts ── */
.list-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px;}
.list-title{font-size:14px;font-weight:700;}
.view-tabs{display:flex;gap:2px;background:var(--bg);border-radius:10px;padding:2px;}
.view-tab{padding:4px 12px;border:none;background:none;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;color:var(--text-sec);transition:all .15s;}
.view-tab.active{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1);}
.pod-list{display:flex;flex-direction:column;gap:2px;}
.pod-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer;transition:background .15s;}
.pod-row:hover{background:var(--bg);}
.pod-cover{width:36px;height:36px;border-radius:8px;object-fit:cover;flex-shrink:0;background:var(--border);}
.pod-info{flex:1;overflow:hidden;}
.pod-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pod-ep{font-size:11px;color:var(--text-sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
.pod-count{flex-shrink:0;font-size:13px;font-weight:700;color:var(--accent);min-width:24px;text-align:right;}
.pod-badge{flex-shrink:0;font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;}
.pod-badge.missing{background:rgba(255,59,48,.1);color:var(--red);}
.pod-badge.ok{background:rgba(52,199,89,.1);color:var(--green);}
.empty{text-align:center;padding:24px;font-size:13px;color:var(--text-sec);}

/* ── Section titre ── */
.section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-sec);margin-bottom:10px;}

/* ── Mobile ── */
@media(max-width:600px){
    .topbar{padding:0 14px;gap:8px;}
    .links{display:none;}
    .main{padding:14px 12px 80px;}
    .summary-val{font-size:26px;}
}
</style>
</head>
<body>

<div class="topbar">
    <div class="topbar-logo">Podcast<span>Tracker</span></div>

    <div class="topbar-right">
        <div class="links">
            <a href="https://jamega-76.github.io/podfight/" target="_blank">Podfighter 2 turbo ⚡</a>
            <a href="https://jamega-76.github.io/streamlife/" target="_blank">📻 StreamLife</a>
        </div>
        <button class="dark-btn" onclick="toggleDark()" title="Mode sombre">🌙</button>
    </div>
</div>

<div class="main">
    <!-- Chargement -->
    <div class="card loading-card" id="loading-card">
        <div class="loading-title" id="loading-title">Chargement…</div>
        <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="progress-label" id="progress-label">Démarrage…</div>
    </div>

    <!-- Résumé -->
    <div class="card" id="summary-card" style="display:none">
        <div class="section-title" id="summary-week-label">Semaine en cours</div>
        <div class="summary-grid">
            <div class="summary-cell">
                <div class="summary-val" id="stat-today">–</div>
                <div class="summary-lbl">Aujourd'hui</div>
            </div>
            <div class="summary-cell">
                <div class="summary-val" id="stat-yesterday">–</div>
                <div class="summary-lbl">Hier</div>
            </div>
            <div class="summary-cell">
                <div class="summary-val" id="stat-8j">–</div>
                <div class="summary-lbl">8 jours</div>
                <div class="summary-sub" id="stat-8j-dates"></div>
            </div>
        </div>
        <!-- Graphe 8 jours -->
        <div class="chart-wrap" id="chart-wrap"></div>
    </div>

    <!-- Liste -->
    <div class="card" id="list-card" style="display:none">
        <div class="list-header">
            <div class="list-title" id="list-title">Publications</div>
            <div class="view-tabs">
                <button class="view-tab active" onclick="setView('today')">Aujourd'hui</button>
                <button class="view-tab" onclick="setView('yesterday')">Hier</button>
                <button class="view-tab" onclick="setView('missing')">Non publiés</button>
            </div>
        </div>
        <div class="pod-list" id="pod-list"></div>
    </div>
</div>

<script>
/* ═══ CONFIG ═══ */
const EUROPE1 = [
{url:"https://feeds.audiomeans.fr/feed/17652c76-f6e2-47da-b4de-ab791a8de6f9.xml",comptabilise:true,natif:false},
    {url:"https://feeds.audiomeans.fr/feed/b38cbcd5-a1b8-4f4c-997a-d40c2c04f9e8.xml",comptabilise:true,natif:false},
    {url:"https://feeds.audiomeans.fr/feed/abd60e2a-fac4-413f-bf0a-463aa19796dc.xml",comptabilise:true,natif:false},
    {url:"https://feeds.audiomeans.fr/feed/7b065cde-def6-4740-b96f-571366b7e54c.xml",comptabilise:true,natif:false},
    {url:"https://feeds.audiomeans.fr/feed/7b5cfe03-5ba9-4428-a41a-cf5c90d4ef49.xml",comptabilise:true,natif:false},
    {url:"https://feeds.audiomeans.fr/feed/c0afb1da-71a8-4a43-8b2f-9decd86c3198.xml",comptabilise:true,natif:false},
    {url:"https://feeds.audiomeans.fr/feed/a8aae616-7e41-429f-a0f5-5b8d1c322fc7.xml",comptabilise:true,natif:false},
    {url:"https://feeds.audiomeans.fr/feed/ea13af31-37bf-4ed1-a0fb-87498c26d64b.xml",comptabilise:true,natif:false},
    {url:"https://feeds.audiomeans.fr/feed/9562ff43-55ee-44af-95e0-db69d162ebae.xml",comptabilise:true,natif:false},
    {url:"https://feeds.audiomeans.fr/feed/4be07d58-3177-4e44-8c9a-9ab1eedd2c34.xml",comptabilise:true,natif:false}
];
const BRANDS = {
    europe1:{label:'Europe 1',accent:'#0070C0',config:EUROPE1},
};

/* ═══ ÉTAT ═══ */
let currentBrand = localStorage.getItem('brand')||'europe1';
let currentView  = 'today';
let allPods      = [];
let DAYS         = []; // 8 timestamps minuit (index 0=J-7 … 7=aujourd'hui)
let failed       = 0;

/* ═══ INIT ═══ */
if(localStorage.getItem('dark')==='1') document.body.classList.add('dark');
applyAccent();
buildDays();
fetchAll();

/* ═══ JOURS ═══ */
function buildDays(){
    const today=new Date(); today.setHours(0,0,0,0);
    DAYS=Array.from({length:8},(_,i)=>{
        const d=new Date(today); d.setDate(d.getDate()-(7-i)); return d.getTime();
    });
}

/* ═══ PROXY FETCH ═══ */
async function fetchFeed(url){
    // Un seul proxy à la fois, en cascade, avec timeout court
    // Proxy 1 : allorigins /get → retourne {contents, status}
    try{
        const r=await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,{signal:AbortSignal.timeout(10000)});
        if(r.ok){
            const j=await r.json();
            if(j.contents&&(j.contents.includes('<rss')||j.contents.includes('<feed'))) return j.contents;
        }
    }catch(e){}
    // Proxy 2 : corsfix.com (gratuit, open source friendly)
    try{
        const r=await fetch(`https://proxy.corsfix.com/?${encodeURIComponent(url)}`,{signal:AbortSignal.timeout(10000)});
        if(r.ok){
            const txt=await r.text();
            if(txt.includes('<rss')||txt.includes('<feed')) return txt;
        }
    }catch(e){}
    return null;
}

/* ═══ FETCH TOUS LES FLUX ═══ */
async function fetchAll(){
    failed=0;
    const config=BRANDS[currentBrand].config;
    const total=config.length;
    let done=0;
    allPods=[];
    setLoading(true,'Synchronisation…','0 / '+total);

    // Groupes de 8 en parallèle
    for(let i=0;i<total;i+=5){
        await Promise.all(config.slice(i,i+5).map(async cfg=>{
            try{
                const xml=await fetchFeed(cfg.url);
                if(!xml) throw 0;
                const doc=new DOMParser().parseFromString(xml,'text/xml');
                const ch=doc.querySelector('channel');
                const name=ch?.querySelector('title')?.textContent||cfg.name||'Podcast';
                const img=ch?.querySelector('image > url')?.textContent
                        ||ch?.querySelector('itunes\\:image')?.getAttribute('href')||'';
                const items=[...doc.querySelectorAll('item')];
                // Compter par jour
                const counts=Array(8).fill(0);
                const latestByDay=[]; // dernier épisode par jour
                items.forEach(item=>{
                    const pub=new Date(item.querySelector('pubDate')?.textContent);
                    if(isNaN(pub)) return;
                    const ts=new Date(pub); ts.setHours(0,0,0,0);
                    const idx=DAYS.indexOf(ts.getTime());
                    if(idx>=0){
                        counts[idx]++;
                        if(!latestByDay[idx]||pub>latestByDay[idx].date)
                            latestByDay[idx]={date:pub,title:item.querySelector('title')?.textContent||''};
                    }
                });
                allPods.push({
                    url:cfg.url, name, img, comptabilise:cfg.comptabilise,
                    counts, latestByDay,
                    latestDate:items.length?new Date(items[0].querySelector('pubDate')?.textContent):null,
                    latestTitle:items[0]?.querySelector('title')?.textContent||'',
                });
            }catch(e){ failed++; }
            done++;
            const pct=Math.round(done/total*100);
            setProgress(pct, done+' / '+total+(failed>0?' — '+failed+' erreur'+(failed>1?'s':''):''));
        }));
    }

    setLoading(false);
    render();
}

/* ═══ RENDU ═══ */
function render(){
    // Stats
    const comp=allPods.filter(p=>p.comptabilise);
    const today=comp.reduce((s,p)=>s+(p.counts[7]||0),0);
    const yesterday=comp.reduce((s,p)=>s+(p.counts[6]||0),0);
    const total8=comp.reduce((s,p)=>p.counts.reduce((a,b)=>a+b,s),0);
    document.getElementById('stat-today').textContent=today;
    document.getElementById('stat-yesterday').textContent=yesterday;
    document.getElementById('stat-8j').textContent=total8;

    // Dates 8 jours
    const fmt=t=>new Date(t).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
    document.getElementById('stat-8j-dates').textContent=fmt(DAYS[0])+' – '+fmt(DAYS[7]);

    // Semaine courante
    const now=new Date();
    const mon=new Date(now); mon.setHours(0,0,0,0); mon.setDate(mon.getDate()-((mon.getDay()+6)%7));
    const sun=new Date(mon); sun.setDate(sun.getDate()+6);
    const tmp=new Date(mon); tmp.setDate(tmp.getDate()+3);
    const wn=Math.ceil(((tmp-new Date(tmp.getFullYear(),0,1))/86400000+1)/7);
    document.getElementById('summary-week-label').textContent=`S${wn} · ${fmt(mon.getTime())} – ${fmt(sun.getTime())}`;

    // Graphe
    const max=Math.max(1,...DAYS.map((_,i)=>comp.reduce((s,p)=>s+(p.counts[i]||0),0)));
    const chartWrap=document.getElementById('chart-wrap');
    chartWrap.innerHTML=DAYS.map((ts,i)=>{
        const c=comp.reduce((s,p)=>s+(p.counts[i]||0),0);
        const h=Math.max(c>0?Math.round((c/max)*72):3,3);
        const isToday=i===7,isYest=i===6;
        const cls=c>0?(isToday?'today':isYest?'yesterday':'has'):'';
        const lbl=new Date(ts).toLocaleDateString('fr-FR',{weekday:'short'});
        const lblCls=isToday?'today':isYest?'yesterday':'';
        const countHtml=c>0&&h>=14?`<span class="chart-count">${c}</span>`:'';
        return `<div class="chart-col">
            <div class="chart-bar ${cls}" style="height:${h}px">${countHtml}</div>
            <span class="chart-lbl ${lblCls}">${lbl}</span>
        </div>`;
    }).join('');

    document.getElementById('summary-card').style.display='';
    document.getElementById('list-card').style.display='';
    renderList();
}

function renderList(){
    const idx=currentView==='today'?7:6;
    const list=document.getElementById('pod-list');
    const title=document.getElementById('list-title');

    if(currentView==='missing'){
        // Non publiés aujourd'hui parmi ceux qui publient habituellement ce jour
        const todayDow=new Date().getDay();
        const missing=allPods.filter(p=>p.comptabilise&&p.counts[7]===0)
            .filter(p=>p.counts.slice(0,7).some((_,i)=>{
                const dow=new Date(DAYS[i]).getDay();
                return dow===todayDow&&p.counts[i]>0;
            }));
        title.textContent=`Non publiés aujourd'hui (${missing.length})`;
        if(!missing.length){
            list.innerHTML='<div class="empty">✓ Tous les podcasts attendus ont publié</div>'; return;
        }
        list.innerHTML=missing.map(p=>`
            <div class="pod-row">
                <img class="pod-cover" src="${p.img}" onerror="this.style.display='none'">
                <div class="pod-info">
                    <div class="pod-name">${p.name}</div>
                    <div class="pod-ep">Dernier : ${p.latestTitle||'–'}</div>
                </div>
                <span class="pod-badge missing">Absent</span>
            </div>`).join('');
        return;
    }

    const pods=allPods.filter(p=>p.comptabilise&&(p.counts[idx]||0)>0)
        .sort((a,b)=>(b.counts[idx]||0)-(a.counts[idx]||0));
    title.textContent=currentView==='today'?`Aujourd'hui (${pods.length} podcasts)`:
        `Hier (${pods.length} podcasts)`;
    if(!pods.length){
        list.innerHTML='<div class="empty">Aucune publication ce jour</div>'; return;
    }
    list.innerHTML=pods.map(p=>{
        const ep=p.latestByDay[idx];
        return `<div class="pod-row">
            <img class="pod-cover" src="${p.img}" onerror="this.style.display='none'">
            <div class="pod-info">
                <div class="pod-name">${p.name}</div>
                <div class="pod-ep">${ep?ep.title:'–'}</div>
            </div>
            <div class="pod-count">${p.counts[idx]}</div>
        </div>`;
    }).join('');
}

/* ═══ CONTRÔLES ═══ */
function setView(v){
    currentView=v;
    document.querySelectorAll('.view-tab').forEach((b,i)=>
        b.classList.toggle('active',['today','yesterday','missing'][i]===v));
    renderList();
}



function applyAccent(){
    document.documentElement.style.setProperty('--accent',BRANDS[currentBrand].accent);
}

function toggleDark(){
    document.body.classList.toggle('dark');
    localStorage.setItem('dark',document.body.classList.contains('dark')?'1':'0');
}

/* ═══ UI LOADING ═══ */
function setLoading(on,title='',label=''){
    document.getElementById('loading-card').style.display=on?'':'none';
    if(on){
        document.getElementById('loading-title').textContent=title;
        document.getElementById('progress-label').textContent=label;
        document.getElementById('progress-fill').style.width='0%';
    }
}
function setProgress(pct,label){
    document.getElementById('progress-fill').style.width=pct+'%';
    document.getElementById('progress-label').textContent=label;
}
</script>
</body>
</html>
