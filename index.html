<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Podflow·2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fafafa;
    --surface:#ffffff;
    --ink:#111111;
    --muted:#96968f;
    --line:#e9e9e4;
    --accent:#2451ff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'JetBrains Mono',monospace; font-variant-numeric:tabular-nums;}

  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:22px 28px;
    border-bottom:1px solid var(--line);
    background:var(--surface);
  }
  .logo{
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    font-size:15px;
    letter-spacing:0.02em;
  }
  .logo span{color:var(--accent);}

  .add-btn{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    font-weight:600;
    letter-spacing:0.03em;
    text-transform:uppercase;
    background:none;
    border:1px solid var(--ink);
    color:var(--ink);
    padding:8px 14px;
    border-radius:3px;
    cursor:pointer;
    transition:background .12s, color .12s;
  }
  .add-btn:hover{background:var(--ink); color:var(--surface);}

  .progress-line{
    height:2px;
    background:var(--line);
    position:relative;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .2s ease;
  }

  .container{
    max-width:760px;
    margin:0 auto;
    padding:0 20px;
  }

  .stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    border-bottom:1px solid var(--line);
    margin-top:8px;
  }
  .stat{
    padding:28px 4px 24px;
    text-align:center;
    border-right:1px solid var(--line);
  }
  .stat:last-child{border-right:none;}
  .stat-num{
    font-family:'JetBrains Mono',monospace;
    font-size:34px;
    font-weight:700;
    line-height:1;
  }
  .stat-label{
    margin-top:8px;
    font-size:11px;
    font-weight:600;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--muted);
  }

  .tabs{
    display:flex;
    gap:24px;
    padding:18px 4px 0;
  }
  .tab{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    font-weight:600;
    letter-spacing:0.03em;
    text-transform:uppercase;
    background:none;
    border:none;
    color:var(--muted);
    padding:0 0 12px;
    cursor:pointer;
    border-bottom:2px solid transparent;
  }
  .tab.active{color:var(--ink); border-bottom-color:var(--accent);}

  .list{margin-top:2px;}
  .row{
    display:flex;
    align-items:baseline;
    gap:16px;
    padding:14px 4px;
    border-bottom:1px solid var(--line);
  }
  .row-time{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--muted);
    width:40px;
    flex-shrink:0;
  }
  .row-body{flex:1; min-width:0;}
  .row-podcast{
    font-size:11px;
    font-weight:600;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:3px;
  }
  .row-title{
    font-size:14.5px;
    font-weight:500;
    line-height:1.35;
    color:var(--ink);
  }
  .row-link{
    flex-shrink:0;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--accent);
    text-decoration:none;
    white-space:nowrap;
  }
  .row-link:hover{text-decoration:underline;}

  .empty{
    padding:60px 0;
    text-align:center;
    color:var(--muted);
    font-size:13.5px;
  }

  /* panel */
  .overlay{
    display:none;
    position:fixed; inset:0;
    background:rgba(17,17,17,0.35);
    z-index:10;
  }
  .overlay.open{display:block;}
  .panel{
    position:fixed;
    top:0; right:0;
    width:340px; max-width:88vw; height:100%;
    background:var(--surface);
    border-left:1px solid var(--line);
    z-index:11;
    transform:translateX(100%);
    transition:transform .18s ease;
    display:flex; flex-direction:column;
  }
  .panel.open{transform:translateX(0);}
  .panel-head{
    padding:20px 22px;
    border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center;
  }
  .panel-head h2{font-size:14px; margin:0; font-weight:700;}
  .panel-close{background:none; border:none; cursor:pointer; font-size:18px; color:var(--muted); line-height:1;}
  .panel-body{padding:20px 22px; overflow-y:auto; flex:1;}
  .field-label{font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted); margin-bottom:6px; display:block;}
  .field-input{
    width:100%;
    border:1px solid var(--line);
    border-radius:3px;
    padding:9px 10px;
    font-size:13px;
    font-family:'JetBrains Mono',monospace;
    margin-bottom:10px;
  }
  .field-input:focus{outline:none; border-color:var(--accent);}
  .panel-add{
    width:100%;
    background:var(--ink);
    color:var(--surface);
    border:none;
    border-radius:3px;
    padding:10px;
    font-size:12px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.03em;
    cursor:pointer;
    margin-bottom:22px;
  }
  .panel-add:hover{opacity:0.85;}
  .feed-count{font-size:11px; color:var(--muted); margin-bottom:10px; text-transform:uppercase; letter-spacing:0.04em; font-weight:600;}
  .feed-item{
    display:flex; justify-content:space-between; align-items:center; gap:8px;
    padding:9px 0;
    border-bottom:1px solid var(--line);
    font-size:12.5px;
  }
  .feed-item span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .feed-remove{background:none; border:none; color:var(--muted); cursor:pointer; font-size:14px; flex-shrink:0;}
  .feed-remove:hover{color:#c0392b;}
</style>
</head>
<body>

<header>
  <div class="logo">PODFLOW<span>·2</span></div>
  <button class="add-btn" onclick="openPanel()">+ Ajouter un flux</button>
</header>
<div class="progress-line"><div class="progress-fill" id="progress"></div></div>

<div class="container">
  <div class="stats">
    <div class="stat">
      <div class="stat-num mono" id="count-today">–</div>
      <div class="stat-label">Aujourd'hui</div>
    </div>
    <div class="stat">
      <div class="stat-num mono" id="count-yesterday">–</div>
      <div class="stat-label">Hier</div>
    </div>
    <div class="stat">
      <div class="stat-num mono" id="count-week">–</div>
      <div class="stat-label">8 jours</div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-filter="today" onclick="setFilter('today', this)">Aujourd'hui</button>
    <button class="tab" data-filter="yesterday" onclick="setFilter('yesterday', this)">Hier</button>
    <button class="tab" data-filter="all" onclick="setFilter('all', this)">8 jours</button>
  </div>

  <div class="list" id="content-area">
    <div class="empty">Chargement des flux…</div>
  </div>
</div>

<div class="overlay" id="overlay" onclick="closePanel()"></div>
<div class="panel" id="panel">
  <div class="panel-head">
    <h2>Gérer les flux</h2>
    <button class="panel-close" onclick="closePanel()">✕</button>
  </div>
  <div class="panel-body">
    <span class="field-label">URL du flux RSS</span>
    <input class="field-input" id="new-feed-url" placeholder="https://feeds.audiomeans.fr/feed/...">
    <button class="panel-add" onclick="addFeed()">Ajouter le flux</button>
    <div class="feed-count" id="feed-count">0 flux suivis</div>
    <div id="feed-list"></div>
  </div>
</div>

  const STORAGE_KEY = 'podflow2-feeds';
  let feeds = [];
  let allEpisodes = [];
  let currentFilter = 'today';

  async function loadFeedList() {
    try {
      const res = await window.storage.get(STORAGE_KEY, false);
      feeds = JSON.parse(res.value);
    } catch (e) {
      feeds = DEFAULT_FEEDS.slice();
      try { await window.storage.set(STORAGE_KEY, JSON.stringify(feeds), false); } catch (e2) {}
    }
  }

  async function saveFeedList() {
    try { await window.storage.set(STORAGE_KEY, JSON.stringify(feeds), false); } catch (e) {}
  }

  function isSameDay(d1, d2) {
    return d1.getDate() === d2.getDate() &&
           d1.getMonth() === d2.getMonth() &&
           d1.getFullYear() === d2.getFullYear();
  }

  async function fetchOneFeed(url) {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 9000);
    try {
      const response = await fetch(url, { signal: controller.signal });
      const text = await response.text();
      const xml = new DOMParser().parseFromString(text, "text/xml");
      const podcastTitle = xml.querySelector("channel > title")?.textContent || "Podcast";
      const items = xml.querySelectorAll("item");
      const eps = [];
      items.forEach(item => {
        const pubDateStr = item.querySelector("pubDate")?.textContent;
        const pubDate = new Date(pubDateStr);
        if (isNaN(pubDate)) return;
        eps.push({
          podcast: podcastTitle,
          title: item.querySelector("title")?.textContent || "Sans titre",
          link: item.querySelector("link")?.textContent || item.querySelector("enclosure")?.getAttribute("url") || "#",
          date: pubDate,
          time: pubDate.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }),
          sourceUrl: url
        });
      });
      return eps;
    } catch (e) {
      return [];
    } finally {
      clearTimeout(timeout);
    }
  }

  async function fetchAllFeeds() {
    allEpisodes = [];
    let done = 0;
    document.getElementById('progress').style.width = '2%';
    const results = await Promise.all(feeds.map(async (url) => {
      const eps = await fetchOneFeed(url);
      done++;
      document.getElementById('progress').style.width = Math.round((done / feeds.length) * 100) + '%';
      return eps;
    }));
    results.forEach(eps => allEpisodes.push(...eps));
    allEpisodes.sort((a, b) => b.date - a.date);
    setTimeout(() => { document.getElementById('progress').style.width = '0%'; }, 400);
    updateDashboard();
  }

  function updateDashboard() {
    const today = new Date();
    const yesterday = new Date(today); yesterday.setDate(yesterday.getDate() - 1);
    const eightDaysAgo = new Date(today); eightDaysAgo.setDate(eightDaysAgo.getDate() - 8);

    document.getElementById('count-today').textContent = allEpisodes.filter(e => isSameDay(e.date, today)).length;
    document.getElementById('count-yesterday').textContent = allEpisodes.filter(e => isSameDay(e.date, yesterday)).length;
    document.getElementById('count-week').textContent = allEpisodes.filter(e => e.date >= eightDaysAgo).length;

    renderList();
  }

  function setFilter(filterType, btn) {
    currentFilter = filterType;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    renderList();
  }

  function renderList() {
    const today = new Date();
    const yesterday = new Date(today); yesterday.setDate(yesterday.getDate() - 1);
    const eightDaysAgo = new Date(today); eightDaysAgo.setDate(eightDaysAgo.getDate() - 8);

    let filtered = [];
    if (currentFilter === 'today') filtered = allEpisodes.filter(e => isSameDay(e.date, today));
    else if (currentFilter === 'yesterday') filtered = allEpisodes.filter(e => isSameDay(e.date, yesterday));
    else filtered = allEpisodes.filter(e => e.date >= eightDaysAgo);

    const area = document.getElementById('content-area');
    if (filtered.length === 0) {
      area.innerHTML = '<div class="empty">Aucune publication sur cette période</div>';
      return;
    }

    area.innerHTML = filtered.map(ep => `
      <div class="row">
        <div class="row-time mono">${ep.time}</div>
        <div class="row-body">
          <div class="row-podcast">${escapeHtml(ep.podcast)}</div>
          <div class="row-title">${escapeHtml(ep.title)}</div>
        </div>
        <a href="${ep.link}" target="_blank" class="row-link">Écouter →</a>
      </div>
    `).join('');
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  // panel
  function openPanel() {
    document.getElementById('panel').classList.add('open');
    document.getElementById('overlay').classList.add('open');
    renderFeedList();
  }
  function closePanel() {
    document.getElementById('panel').classList.remove('open');
    document.getElementById('overlay').classList.remove('open');
  }

  function renderFeedList() {
    document.getElementById('feed-count').textContent = feeds.length + ' flux suivis';
    document.getElementById('feed-list').innerHTML = feeds.map((url, i) => `
      <div class="feed-item">
        <span title="${url}">${url.replace('https://feeds.audiomeans.fr/feed/', '').replace('.xml', '')}</span>
        <button class="feed-remove" onclick="removeFeed(${i})">✕</button>
      </div>
    `).join('');
  }

  async function addFeed() {
    const input = document.getElementById('new-feed-url');
    const url = input.value.trim();
    if (!url) return;
    if (feeds.includes(url)) { input.value = ''; return; }
    feeds.push(url);
    await saveFeedList();
    input.value = '';
    renderFeedList();
    const eps = await fetchOneFeed(url);
    allEpisodes.push(...eps);
    allEpisodes.sort((a, b) => b.date - a.date);
    updateDashboard();
  }

  async function removeFeed(index) {
    const url = feeds[index];
    feeds.splice(index, 1);
    await saveFeedList();
    allEpisodes = allEpisodes.filter(e => e.sourceUrl !== url);
    renderFeedList();
    fetchAllFeeds();
  }

  document.getElementById('new-feed-url').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') addFeed();
  });

  (async () => {
    await loadFeedList();
    await fetchAllFeeds();
  })();
</script>
</body>
</html>
